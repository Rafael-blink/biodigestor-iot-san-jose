<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biodigestor Mágico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background-color: #e0f7fa; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #00695c; font-size: 2.6em; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        h1 svg { width: 1em; height: 1em; }

        .icono { display: inline-block; }
        .icono svg { width: 100%; height: 100%; display: block; }

        .contenedor { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 24px; }
        .tarjeta { background-color: white; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); padding: 16px; width: 170px; }
        .tarjeta .icono { width: 52px; height: 52px; margin-bottom: 4px; }
        .tarjeta h2 { margin: 0; font-size: 1.3em; color: #00796b; }
        .valor { font-size: 2.6em; font-weight: bold; margin: 8px 0; }
        .temp { color: #d32f2f; } .nivel { color: #1976d2; } .presion { color: #f57c00; } .metano { color: #7b1fa2; }
        #actualizacion { margin-top: 24px; color: #555; font-size: 1.1em; }

        .filtros { margin-top: 24px; }
        .filtros button { font-family: inherit; padding: 10px 20px; margin: 5px; border: none; border-radius: 10px; background: #b2dfdb; cursor: pointer; font-size: 1em; font-weight: bold; color: #004d40; }
        .filtros button:hover { background: #80cbc4; }
        .filtros button.activo { background: #00695c; color: white; }

        /* Cuadrícula 2x2 de gráficas */
        .graficas-container { max-width: 1000px; margin: 20px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grafica-box { background: white; border-radius: 20px; padding: 14px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .grafica-box h2 { margin: 0 0 8px 0; font-size: 1.2em; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .grafica-box h2 .icono { width: 26px; height: 26px; }
        .grafica-box .lienzo { position: relative; height: 200px; }
        .t-temp { color: #d32f2f; } .t-nivel { color: #1976d2; } .t-presion { color: #f57c00; } .t-metano { color: #7b1fa2; }

        @media (max-width: 700px) {
            .graficas-container { grid-template-columns: 1fr; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <h1>
        <svg viewBox="0 0 24 24" fill="#43a047"><path d="M20 4C10 4 4 9 4 15c0 1.6.5 3 1.3 4.2C6 15 9 11.5 14 9c-3.5 3-6 6.5-7 11 1 .6 2.2 1 3.5 1C17 21 20 14 20 4z"/></svg>
        Mi Biodigestor Mágico
        <svg viewBox="0 0 24 24" fill="#43a047"><path d="M20 4C10 4 4 9 4 15c0 1.6.5 3 1.3 4.2C6 15 9 11.5 14 9c-3.5 3-6 6.5-7 11 1 .6 2.2 1 3.5 1C17 21 20 14 20 4z"/></svg>
    </h1>
    <p>¡Mira lo que está pasando dentro!</p>

    <div class="contenedor">
        <div class="tarjeta">
            <span class="icono temp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z"/></svg></span>
            <h2>Temperatura</h2>
            <div class="valor temp" id="temp">--</div>
            <div>°C</div>
        </div>
        <div class="tarjeta">
            <span class="icono nivel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z"/></svg></span>
            <h2>Nivel de Agua</h2>
            <div class="valor nivel" id="nivel">--</div>
            <div>%</div>
        </div>
        <div class="tarjeta">
            <span class="icono presion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="12" x2="17" y2="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span>
            <h2>Presión</h2>
            <div class="valor presion" id="presion">--</div>
            <div>kPa</div>
        </div>
        <div class="tarjeta">
            <span class="icono metano"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-4-1-6 1-9.5z"/></svg></span>
            <h2>Gas Metano</h2>
            <div class="valor metano" id="metano">--</div>
            <div>Rs/R0</div>
        </div>
    </div>

    <div id="actualizacion">Cargando datos...</div>

    <div class="filtros">
        <button onclick="filtrarGraficas(1)" id="btn-1d" class="activo">Últimas 24h</button>
        <button onclick="filtrarGraficas(7)" id="btn-7d">Toda la Semana</button>
    </div>

    <div class="graficas-container">
        <div class="grafica-box">
            <h2 class="t-temp"><span class="icono"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z"/></svg></span>Temperatura (°C)</h2>
            <div class="lienzo"><canvas id="chartTemp"></canvas></div>
        </div>

        <div class="grafica-box">
            <h2 class="t-nivel"><span class="icono"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z"/></svg></span>Nivel de Agua (%)</h2>
            <div class="lienzo"><canvas id="chartNivel"></canvas></div>
        </div>

        <div class="grafica-box">
            <h2 class="t-presion"><span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="12" x2="17" y2="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span>Presión (kPa)</h2>
            <div class="lienzo"><canvas id="chartPresion"></canvas></div>
        </div>

        <div class="grafica-box">
            <h2 class="t-metano"><span class="icono"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-4-1-6 1-9.5z"/></svg></span>Gas Metano (Rs/R0)</h2>
            <div class="lienzo"><canvas id="chartMetano"></canvas></div>
        </div>
    </div>

    <script>
        let charts = { temp: null, nivel: null, presion: null, metano: null };
        let datosHistorial = [];
        let semanaActual = "";

        async function cargarHistorial() {
            try {
                const respSemana = await fetch('historial/semana_actual.txt?t=' + new Date().getTime());
                if (!respSemana.ok) throw new Error("No semana");
                const nuevaSemana = (await respSemana.text()).trim();

                const respCsv = await fetch(`historial/${nuevaSemana}.csv?t=` + new Date().getTime());
                if (!respCsv.ok) throw new Error("No CSV");
                const texto = await respCsv.text();
                semanaActual = nuevaSemana;

                const lineas = texto.trim().split('\n');
                datosHistorial = lineas.slice(1).map(linea => {
                    const valores = linea.split(',');
                    return {
                        fecha: new Date(valores[0].replace(' ', 'T')),
                        temperatura: parseFloat(valores[1]),
                        nivel: parseFloat(valores[2]),
                        presion: parseFloat(valores[3]),
                        metano: parseFloat(valores[4])
                    };
                }).filter(d => !isNaN(d.fecha.getTime()));

                if (datosHistorial.length > 0) {
                    const ultimo = datosHistorial[datosHistorial.length - 1];
                    document.getElementById('temp').textContent = isNaN(ultimo.temperatura) ? '--' : ultimo.temperatura.toFixed(1);
                    document.getElementById('nivel').textContent = isNaN(ultimo.nivel) ? '--' : ultimo.nivel.toFixed(1);
                    document.getElementById('presion').textContent = isNaN(ultimo.presion) ? '--' : ultimo.presion.toFixed(2);
                    document.getElementById('metano').textContent = isNaN(ultimo.metano) ? '--' : ultimo.metano.toFixed(2);
                    document.getElementById('actualizacion').textContent = 'Última actualización: ' + ultimo.fecha.toLocaleString();
                }

                const botonActivo = document.querySelector('.filtros button.activo');
                const dias = botonActivo && botonActivo.id === 'btn-7d' ? 7 : 1;
                dibujarGraficas(dias);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('actualizacion').textContent = 'Esperando datos nuevos...';
            }
        }

        function crearGrafica(idCanvas, label, color, datos, etiquetas, unidad) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: label,
                        data: datos,
                        borderColor: color,
                        backgroundColor: color + '20',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: true,
                        spanGaps: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { maxTicksLimit: 5, font: { size: 10 } } },
                        y: { ticks: { font: { size: 10 } }, title: { display: true, text: unidad, font: { size: 10 } } }
                    }
                }
            });
        }

        function dibujarGraficas(dias) {
            if (datosHistorial.length === 0) return;

            // Usamos la fecha del último dato como referencia (no la hora del navegador)
            const referencia = datosHistorial[datosHistorial.length - 1].fecha;
            const limite = new Date(referencia.getTime() - (dias * 24 * 60 * 60 * 1000));
            const filtrados = datosHistorial.filter(d => d.fecha >= limite);

            const etiquetas = filtrados.map(d => dias === 1
                ? d.fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : d.fecha.toLocaleDateString([], { weekday: 'short' }) + ' ' + d.fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

            Object.keys(charts).forEach(k => { if (charts[k]) charts[k].destroy(); });

            // Ventana de suavizado (en puntos; 1 punto = 5 min). Súbela para más suavizado.
            const v = dias === 1 ? VENTANA_24H : VENTANA_SEMANA;

            charts.temp = crearGrafica('chartTemp', 'Temperatura', '#d32f2f', suavizar(filtrados.map(d => d.temperatura), v), etiquetas, '°C');
            charts.nivel = crearGrafica('chartNivel', 'Nivel', '#1976d2', suavizar(filtrados.map(d => d.nivel), v), etiquetas, '%');
            charts.presion = crearGrafica('chartPresion', 'Presión', '#f57c00', suavizar(filtrados.map(d => d.presion), v), etiquetas, 'kPa');
            charts.metano = crearGrafica('chartMetano', 'Metano', '#7b1fa2', suavizar(filtrados.map(d => d.metano), v), etiquetas, 'Rs/R0');
        }

        // Promedio móvil centrado: cada punto es el promedio de sus vecinos (ignora NaN)
        const VENTANA_24H = 9;      // ~45 min
        const VENTANA_SEMANA = 25;  // ~2 horas
        function suavizar(datos, ventana) {
            const mitad = Math.floor(ventana / 2);
            return datos.map((_, i) => {
                let suma = 0, n = 0;
                for (let j = Math.max(0, i - mitad); j <= Math.min(datos.length - 1, i + mitad); j++) {
                    if (!isNaN(datos[j])) { suma += datos[j]; n++; }
                }
                return n > 0 ? suma / n : NaN;
            });
        }

        function filtrarGraficas(dias) {
            document.querySelectorAll('.filtros button').forEach(btn => btn.classList.remove('activo'));
            document.getElementById(dias === 1 ? 'btn-1d' : 'btn-7d').classList.add('activo');
            dibujarGraficas(dias);
        }

        cargarHistorial();
        setInterval(cargarHistorial, 30000);
    </script>
</body>
</html>
