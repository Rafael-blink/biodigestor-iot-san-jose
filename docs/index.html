<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biodigestor Mágico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background-color: #e0f7fa; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #00695c; font-size: 3em; }
        .contenedor { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .tarjeta { background-color: white; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); padding: 20px; width: 200px; }
        .tarjeta h2 { margin: 0; font-size: 1.5em; color: #00796b; }
        .valor { font-size: 3em; font-weight: bold; margin: 10px 0; }
        .temp { color: #d32f2f; } .nivel { color: #1976d2; } .presion { color: #f57c00; } .metano { color: #7b1fa2; }
        .emoji { font-size: 4em; }
        #actualizacion { margin-top: 30px; color: #555; font-size: 1.2em; }
        
        .graficas-container { max-width: 800px; margin: 40px auto; display: flex; flex-direction: column; gap: 30px; }
        .grafica-box { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .grafica-box h2 { margin-top: 0; color: #00695c; }
        .filtros { margin-bottom: 20px; }
        .filtros button { font-family: inherit; padding: 10px 20px; margin: 5px; border: none; border-radius: 10px; background: #b2dfdb; cursor: pointer; font-size: 1em; font-weight: bold; color: #004d40; }
        .filtros button:hover { background: #80cbc4; }
        .filtros button.activo { background: #00695c; color: white; }
    </style>
</head>
<body>
    <h1>🌱 Mi Biodigestor Mágico 🌱</h1>
    <p>¡Mira lo que está pasando dentro!</p>

    <div class="contenedor">
        <div class="tarjeta">
            <div class="emoji">🌡️</div>
            <h2>Temperatura</h2>
            <div class="valor temp" id="temp">--</div>
            <div>°C</div>
        </div>
        <div class="tarjeta">
            <div class="emoji">💧</div>
            <h2>Nivel de Agua</h2>
            <div class="valor nivel" id="nivel">--</div>
            <div>%</div>
        </div>
        <div class="tarjeta">
            <div class="emoji">💨</div>
            <h2>Presión</h2>
            <div class="valor presion" id="presion">--</div>
            <div>kPa</div>
        </div>
        <div class="tarjeta">
            <div class="emoji">🔥</div>
            <h2>Gas Metano</h2>
            <div class="valor metano" id="metano">--</div>
            <div>Rs/R0</div>
        </div>
    </div>

    <div id="actualizacion">Cargando datos...</div>

    <div class="graficas-container">
        <div class="grafica-box">
            <h2>📈 Temperatura (°C)</h2>
            <div class="filtros">
                <button onclick="filtrarGraficas(1)" id="btn-1d" class="activo">Últimas 24h</button>
                <button onclick="filtrarGraficas(7)" id="btn-7d">Toda la Semana</button>
            </div>
            <canvas id="chartTemp"></canvas>
        </div>

        <div class="grafica-box">
            <h2>💧 Nivel de Agua (%)</h2>
            <canvas id="chartNivel"></canvas>
        </div>

        <div class="grafica-box">
            <h2>💨 Presión (kPa)</h2>
            <canvas id="chartPresion"></canvas>
        </div>

        <div class="grafica-box">
            <h2>🔥 Gas Metano (Rs/R0)</h2>
            <canvas id="chartMetano"></canvas>
        </div>
    </div>

    <script>
        let charts = { temp: null, nivel: null, presion: null, metano: null };
        let datosHistorial = [];
        let semanaActual = "";

        async function cargarHistorial() {
            try {
                const respSemana = await fetch('historial/semana_actual.txt?t=' + new Date().getTime());
                if (!respSemana.ok) throw new Error("No semana");
                const nuevaSemana = (await respSemana.text()).trim();

                if (nuevaSemana !== semanaActual) {
                    semanaActual = nuevaSemana;
                    const respCsv = await fetch(`historial/${semanaActual}.csv?t=` + new Date().getTime());
                    if (!respCsv.ok) throw new Error("No CSV");
                    const texto = await respCsv.text();
                    
                    const lineas = texto.trim().split('\n');
                    datosHistorial = lineas.slice(1).map(linea => {
                        const valores = linea.split(',');
                        return {
                            fecha: new Date(valores[0]),
                            temperatura: parseFloat(valores[1]),
                            nivel: parseFloat(valores[2]),
                            presion: parseFloat(valores[3]),
                            metano: parseFloat(valores[4])
                        };
                    }).filter(d => !isNaN(d.fecha.getTime()));
                }

                if (datosHistorial.length > 0) {
                    const ultimo = datosHistorial[datosHistorial.length - 1];
                    document.getElementById('temp').textContent = isNaN(ultimo.temperatura) ? '--' : ultimo.temperatura.toFixed(1);
                    document.getElementById('nivel').textContent = isNaN(ultimo.nivel) ? '--' : ultimo.nivel.toFixed(1);
                    document.getElementById('presion').textContent = isNaN(ultimo.presion) ? '--' : ultimo.presion.toFixed(2);
                    document.getElementById('metano').textContent = isNaN(ultimo.metano) ? '--' : ultimo.metano.toFixed(2);
                    document.getElementById('actualizacion').textContent = 'Última actualización: ' + ultimo.fecha.toLocaleString();
                }

                const botonActivo = document.querySelector('.filtros button.activo');
                const dias = botonActivo && botonActivo.id === 'btn-7d' ? 7 : 1;
                dibujarGraficas(dias);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('actualizacion').textContent = 'Esperando datos nuevos...';
            }
        }

        function crearGrafica(idCanvas, label, color, datos, etiquetas, unidad) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: label,
                        data: datos,
                        borderColor: color,
                        backgroundColor: color + '20', // 20 es el nivel de opacidad
                        borderWidth: 2,
                        pointRadius: 0, // Sin puntos para que se vea como una línea continua
                        tension: 0.4,  // Aquí está el suavizado
                        spanGaps: true // Une los huecos si hay datos NaN
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false }, // Ocultamos el eje X en las gráficas secundarias para ahorrar espacio
                        y: { title: { display: true, text: unidad } }
                    }
                }
            });
        }

        function dibujarGraficas(dias) {
            if (datosHistorial.length === 0) return;

            const ahora = new Date();
            const limite = new Date(ahora.getTime() - (dias * 24 * 60 * 60 * 1000));
            const filtrados = datosHistorial.filter(d => d.fecha >= limite);

            const etiquetas = filtrados.map(d => d.fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

            // Destruir gráficas anteriores si existen
            Object.keys(charts).forEach(k => { if (charts[k]) charts[k].destroy(); });

            // Crear las 4 gráficas
            charts.temp = crearGrafica('chartTemp', 'Temperatura', '#d32f2f', filtrados.map(d => d.temperatura), etiquetas, '°C');
            charts.nivel = crearGrafica('chartNivel', 'Nivel', '#1976d2', filtrados.map(d => d.nivel), etiquetas, '%');
            charts.presion = crearGrafica('chartPresion', 'Presión', '#f57c00', filtrados.map(d => d.presion), etiquetas, 'kPa');
            charts.metano = crearGrafica('chartMetano', 'Metano', '#7b1fa2', filtrados.map(d => d.metano), etiquetas, 'Rs/R0');

            // Mostrar el eje X solo en la última gráfica para mantener la estética limpia
            charts.metano.options.scales.x.display = true;
            charts.metano.options.scales.x.title = { display: true, text: 'Hora' };
            charts.metano.update();
        }

        function filtrarGraficas(dias) {
            document.querySelectorAll('.filtros button').forEach(btn => btn.classList.remove('activo'));
            document.getElementById(dias === 1 ? 'btn-1d' : 'btn-7d').classList.add('activo');
            dibujarGraficas(dias);
        }

        cargarHistorial();
        setInterval(cargarHistorial, 30000);
    </script>
</body>
</html>
