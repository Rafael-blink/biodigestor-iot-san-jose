<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biodigestor Mágico</title>
    <!-- Cargamos Chart.js desde su CDN oficial -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background-color: #e0f7fa; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #00695c; font-size: 3em; }
        .contenedor { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .tarjeta { background-color: white; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); padding: 20px; width: 200px; }
        .tarjeta h2 { margin: 0; font-size: 1.5em; color: #00796b; }
        .valor { font-size: 3em; font-weight: bold; margin: 10px 0; }
        .temp { color: #d32f2f; } .nivel { color: #1976d2; } .presion { color: #f57c00; } .metano { color: #7b1fa2; }
        .emoji { font-size: 4em; }
        #actualizacion { margin-top: 30px; color: #555; font-size: 1.2em; }
        
        /* Estilos para la gráfica */
        .grafica-container { background: white; border-radius: 20px; padding: 20px; margin: 40px auto; max-width: 800px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .filtros { margin-bottom: 20px; }
        .filtros button { font-family: inherit; padding: 10px 20px; margin: 5px; border: none; border-radius: 10px; background: #b2dfdb; cursor: pointer; font-size: 1em; font-weight: bold; color: #004d40; }
        .filtros button:hover { background: #80cbc4; }
        .filtros button.activo { background: #00695c; color: white; }
    </style>
</head>
<body>
    <h1>🌱 Mi Biodigestor Mágico 🌱</h1>
    <p>¡Mira lo que está pasando dentro!</p>

    <div class="contenedor">
        <div class="tarjeta">
            <div class="emoji">🌡️</div>
            <h2>Temperatura</h2>
            <div class="valor temp" id="temp">--</div>
            <div>°C</div>
        </div>
        <div class="tarjeta">
            <div class="emoji">💧</div>
            <h2>Nivel de Biol</h2>
            <div class="valor nivel" id="nivel">--</div>
            <div>%</div>
        </div>
        <div class="tarjeta">
            <div class="emoji">💨</div>
            <h2>Presión</h2>
            <div class="valor presion" id="presion">--</div>
            <div>kPa</div>
        </div>
        <div class="tarjeta">
            <div class="emoji">🔥</div>
            <h2>Gas Metano</h2>
            <div class="valor metano" id="metano">--</div>
            <div>Rs/R0</div>
        </div>
    </div>

    <div id="actualizacion">Cargando datos...</div>

    <!-- Sección de la Gráfica Histórica -->
    <div class="grafica-container">
        <h2>📈 Historia del Biodigestor</h2>
        <div class="filtros">
            <button onclick="filtrarGrafica(1)" id="btn-1d" class="activo">1 Día</button>
            <button onclick="filtrarGrafica(7)" id="btn-7d">1 Semana</button>
            <button onclick="filtrarGrafica(30)" id="btn-30d">1 Mes</button>
        </div>
        <canvas id="graficaHistorial"></canvas>
    </div>

    <script>
        let chartInstance = null;
        let datosHistorial = []; // Aquí guardaremos todos los datos del CSV

        // Función para leer el CSV
        async function cargarHistorial() {
            try {
                const respuesta = await fetch('historial.csv?t=' + new Date().getTime());
                const texto = await respuesta.text();
                
                // Parsear el CSV simple (ignorando líneas vacías)
                const lineas = texto.trim().split('\n');
                const cabecera = lineas[0].split(',');
                
                datosHistorial = lineas.slice(1).map(linea => {
                    const valores = linea.split(',');
                    return {
                        fecha: new Date(valores[0]),
                        temperatura: parseFloat(valores[1]),
                        nivel: parseFloat(valores[2]),
                        presion: parseFloat(valores[3]),
                        metano: parseFloat(valores[4])
                    };
                }).filter(d => !isNaN(d.fecha.getTime())); // Filtrar fechas inválidas

                // Actualizar las tarjetas con el último dato
                if (datosHistorial.length > 0) {
                    const ultimo = datosHistorial[datosHistorial.length - 1];
                    document.getElementById('temp').textContent = isNaN(ultimo.temperatura) ? '--' : ultimo.temperatura.toFixed(1);
                    document.getElementById('nivel').textContent = isNaN(ultimo.nivel) ? '--' : ultimo.nivel.toFixed(1);
                    document.getElementById('presion').textContent = isNaN(ultimo.presion) ? '--' : ultimo.presion.toFixed(2);
                    document.getElementById('metano').textContent = isNaN(ultimo.metano) ? '--' : ultimo.metano.toFixed(2);
                    document.getElementById('actualizacion').textContent = 'Última actualización: ' + ultimo.fecha.toLocaleString();
                }

                // Dibujar la gráfica con el filtro activo
                dibujarGrafica(1);

            } catch (error) {
                console.error('Error al cargar historial:', error);
                document.getElementById('actualizacion').textContent = 'No se pudieron cargar los datos históricos.';
            }
        }

        // Función para dibujar/filtrar la gráfica
        function dibujarGrafica(dias) {
            if (datosHistorial.length === 0) return;

            // Filtrar datos según los días seleccionados
            const ahora = new Date();
            const limite = new Date(ahora.getTime() - (dias * 24 * 60 * 60 * 1000));
            const datosFiltrados = datosHistorial.filter(d => d.fecha >= limite);

            const etiquetas = datosFiltrados.map(d => d.fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            const valoresTemp = datosFiltrados.map(d => d.temperatura);

            if (chartInstance) {
                chartInstance.destroy(); // Destruir gráfica anterior
            }

            const ctx = document.getElementById('graficaHistorial').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: 'Temperatura (°C)',
                        data: valoresTemp,
                        borderColor: '#d32f2f',
                        backgroundColor: 'rgba(211, 47, 47, 0.1)',
                        borderWidth: 3,
                        pointRadius: 3,
                        tension: 0.4 // Suaviza la línea
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Hora' } },
                        y: { title: { display: true, text: 'Temperatura (°C)' } }
                    }
                }
            });
        }

        // Función para los botones de filtro
        function filtrarGrafica(dias) {
            // Cambiar botón activo
            document.querySelectorAll('.filtros button').forEach(btn => btn.classList.remove('activo'));
            document.getElementById('btn-' + (dias === 1 ? '1d' : dias === 7 ? '7d' : '30d')).classList.add('activo');
            
            dibujarGrafica(dias);
        }

        // Cargar al inicio
        cargarHistorial();
        // Recargar cada 30 segundos
        setInterval(cargarHistorial, 30000);
    </script>
</body>
</html>
