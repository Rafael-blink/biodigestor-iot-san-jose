name: Agregar dato
on:
  repository_dispatch:
    types: [nuevo-dato]
concurrency: historial
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar linea al CSV
        env:
          LINEA: ${{ github.event.client_payload.linea }}
        run: echo "$LINEA" >> docs/historial.csv
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/historial.csv
          git commit -m "Nuevo dato de sensor"
          git push origin HEAD:main
